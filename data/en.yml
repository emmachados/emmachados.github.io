line_blocks:
  - key: transqueer
    title: Trans and queer linguistics
    text: >-
      Language as evidence of trans and queer life, and as an instrument
      used on it. I work with recorded voices, online communities,
      parliamentary debate and clinical protocols, which is to say with
      people describing themselves and with strangers doing it for them at
      greater length.
  - key: sociophonetics
    title: Sociophonetics
    text: >-
      The voice as social behavior, measured acoustically. Spontaneous
      speech and perception experiments, on the assumption that what a
      listener does with a voice is at least as interesting as what the
      speaker meant by it.
  - key: clinical
    title: Clinical linguistics
    text: >-
      Speech in depression and in cognitive decline, and the distance
      between a statistically significant difference and a diagnostic
      marker. The literature crosses it faster than I do.
  - key: discourse
    title: Critical discourse analysis
    text: >-
      How parliamentary, biomedical and online discourses name and regulate
      trans identity and neurodivergence, and what the communities on the
      receiving end write back.
  - key: technology
    title: Language technology
    text: >-
      Corpora, classifiers and large language models, for questions too
      large to answer by hand. They also make excellent informants on what
      has been said about the people they describe, having read most of it.

