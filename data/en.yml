home:
  bio_1: >-
    I am a PhD Candidate in the Department of Spanish Language at the
    Universidad de Salamanca, on a PR-2023 contract from the Junta de
    Castilla y León and the ESF+. My dissertation asks how transfeminine
    voices are produced and heard in Peninsular Spanish, which means
    measuring the acoustics of spontaneous speech and then asking listeners
    what they thought they heard.
  bio_2: >-
    I also publish in clinical linguistics, mainly the speech of people
    living with depression or with cognitive decline, and on the language
    used to talk about trans people and about neurodivergence.
  standfirst: PhD Candidate in Linguistics at the Universidad de Salamanca.
