line_blocks:
  - key: transqueer
    title: Lingüística trans y queer
    text: >-
      La lengua como testimonio de las vidas trans y queer, así como
      instrumento que se usa sobre ellas. Trabajo con voces, comunidades en
      línea, debates parlamentarios y protocolos clínicos: es decir, con
      personas que se describen a sí mismas y con desconocidos que lo hacen
      en su lugar (y con más páginas).
  - key: sociophonetics
    title: Sociofonética
    text: >-
      La voz como comportamiento social, medida acústicamente. Habla
      espontánea y experimentos de percepción, partiendo de que lo que un
      oyente hace con una voz interesa al menos tanto como lo que quien
      habla quiso decir con ella.
  - key: clinical
    title: Lingüística clínica
    text: >-
      El habla en la depresión y en el deterioro cognitivo, y la distancia
      entre una diferencia estadísticamente significativa y un marcador
      diagnóstico. La bibliografía la recorre más rápido que yo.
  - key: discourse
    title: Análisis crítico del discurso
    text: >-
      Cómo los discursos parlamentarios, biomédicos y en línea nombran y
      regulan la identidad trans y la neurodivergencia y qué escriben en
      respuesta las comunidades a las que se dirigen.
  - key: technology
    title: Lingüística computacional
    text: >-
      Corpus, clasificadores y grandes modelos de lengua, para preguntas
      demasiado grandes como para responderlas a mano. Son además excelentes
      informantes sobre lo que se ha dicho de las personas que describen,
      puesto que lo han leído casi todo.

