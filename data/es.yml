home:
  bio_1: >-
    Soy doctoranda en el Departamento de Lengua Española de la Universidad
    de Salamanca, con un contrato PR-2023 de la Junta de Castilla y León y
    el FSE+. Mi tesis pregunta cómo se producen y se oyen las voces
    transfemeninas en español peninsular, lo que supone medir la acústica
    del habla espontánea y preguntar a los oyentes qué creen oír.
  bio_2: >-
    También publico en lingüística clínica, principalmente acerca del habla
    de personas con depresión mayor o con deterioro cognitivo, y sobre el
    lenguaje que se emplea al hablar acerca de las personas trans y de la
    neurodivergencia.
  standfirst: Investigadora predoctoral en formación en Lingüística en la Universidad de Salamanca.
  profile_heading: Perfil
  lines_heading: En qué trabajo
  selected_heading: Publicaciones seleccionadas
