- id: predoc-usal
  role:
    en: PhD Candidate
    es: Investigadora predoctoral en formación
  org: Universidad de Salamanca
  start: 2024-11
  end: null
  detail:
    en:
      - Design, collection, and acoustic and statistical analysis of speech corpora.
      - Teaching in «Habla y lenguaje» (Grado en Audiología) and «Lingüística general» (Grado en Estudios Ingleses).
      - Member of the Erasmus+ project COMMUNIKITE.
      - Responsible for the K6 package on intercultural experiences.
      - Principal investigator of INCLUSIVE, on inclusive communication with trans and non-binary students.
    es:
      - Diseño, recogida y análisis acústico y estadístico de corpus de habla.
      - Docencia en «Habla y lenguaje» (Grado en Audiología) y «Lingüística general» (Grado en Estudios Ingleses).
      - Miembro del proyecto Erasmus+ COMMUNIKITE.
      - Responsable del paquete K6, dedicado a las experiencias interculturales.
      - Investigadora principal de INCLUSIVE, dedicado a las prácticas de comunicación inclusiva con estudiantes trans y no binaries.

